<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1512">
<title>Nano-Hermes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1512;--surface:#111E19;--surface2:#16261F;--surface3:#1D3028;
  --ink:#F0F5F1;--ink2:#B2C0B6;--ink3:#7E8F85;
  --line:#1F322A;--accent:#8FD3AE;--accent2:#5E9B7E;
  --red:#E88B8F;--amber:#F0B357;--blue:#8BB8E8;
  --r:14px;--r2:20px;
  --sh:0 2px 8px rgba(0,0,0,.3),0 16px 40px -20px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn",system-ui,sans-serif;
  line-height:1.7;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:290px 1fr;height:100vh}

/* === sidebar === */
aside{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(143,211,174,.15);
  animation:pulse 2.6s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.side-body{flex:1;overflow-y:auto;padding:10px}
.side-body::-webkit-scrollbar{width:5px}
.side-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.sec-t{font-size:.72rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:8px 8px 6px}
.chat-item{padding:9px 11px;border-radius:10px;cursor:pointer;font-size:.87rem;margin-bottom:3px;
  transition:background .15s var(--ease);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item:hover{background:var(--surface2)}
.chat-item.on{background:var(--surface3);color:var(--accent);font-weight:600}

/* === main === */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:rgba(11,21,18,.86);backdrop-filter:blur(14px);flex-wrap:wrap}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,.inp{background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:.86rem;outline:none;transition:border-color .15s}
select:focus,.inp:focus{border-color:var(--accent2)}
select{cursor:pointer;max-width:230px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface2);cursor:pointer;font-size:.85rem;font-weight:600;
  transition:transform .12s var(--ease),background .15s,border-color .15s}
.btn:hover{background:var(--surface3);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.p{background:var(--accent);color:#0B1512;border-color:var(--accent)}
.btn.p:hover{background:#A2DFC0}
.btn.d{color:var(--red);border-color:rgba(232,139,143,.3)}
.spacer{flex:1}

/* === chat === */
#chat{flex:1;overflow-y:auto;padding:22px 20px 12px;display:flex;flex-direction:column;gap:14px}
#chat::-webkit-scrollbar{width:7px}
#chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.msg{max-width:min(780px,88%);padding:12px 16px;border-radius:var(--r);font-size:.92rem;
  animation:in .3s var(--ease);white-space:pre-wrap;word-wrap:break-word}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-start;background:var(--accent);color:#0B1512;font-weight:500;border-end-start-radius:4px}
.msg.a{align-self:flex-end;background:var(--surface2);border:1px solid var(--line);border-end-end-radius:4px}
.msg.e{align-self:flex-end;background:rgba(232,139,143,.1);border:1px solid rgba(232,139,143,.3);color:var(--red)}
.msg code{font-family:"JetBrains Mono",monospace;font-size:.83em;background:rgba(0,0,0,.35);
  padding:2px 6px;border-radius:5px;direction:ltr;display:inline-block}
.msg pre{font-family:"JetBrains Mono",monospace;font-size:.8em;background:#08110E;border:1px solid var(--line);
  padding:11px;border-radius:10px;overflow-x:auto;direction:ltr;text-align:left;margin:8px 0}
.step{align-self:flex-end;max-width:min(780px,88%);font-size:.79rem;font-family:"JetBrains Mono",monospace;
  color:var(--ink3);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:7px 12px;direction:ltr}
.step b{color:var(--blue);font-weight:600}

/* === composer === */
.composer{padding:14px 18px 18px;border-top:1px solid var(--line);background:var(--surface)}
.crow{display:flex;gap:9px;align-items:flex-end}
#input{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 15px;font-size:.92rem;resize:none;max-height:190px;min-height:48px;outline:none;
  transition:border-color .15s;font-family:inherit}
#input:focus{border-color:var(--accent2)}
#send{width:48px;height:48px;border-radius:var(--r);background:var(--accent);color:#0B1512;border:0;
  cursor:pointer;font-size:1.25rem;display:grid;place-items:center;transition:transform .12s var(--ease),background .15s}
#send:hover{background:#A2DFC0;transform:scale(1.04)}
#send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hint{font-size:.74rem;color:var(--ink3);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
.hint kbd{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  font-family:"JetBrains Mono",monospace;font-size:.72rem}

/* === modal === */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:100;
  display:none;place-items:center;padding:18px}
.mask.on{display:grid}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:22px;
  width:min(620px,100%);max-height:88vh;overflow-y:auto;box-shadow:var(--sh)}
.modal h2{font-size:1.12rem;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field input,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;font-size:.87rem;outline:none;direction:ltr;text-align:left}
.field input:focus,.field textarea:focus{border-color:var(--accent2)}
.prov{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}
.prov-h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.prov-n{font-weight:700;font-size:.94rem}
.badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:6px}
.badge.h{background:rgba(139,184,232,.15);color:var(--blue)}
.badge.m{background:rgba(240,179,87,.15);color:var(--amber)}
.badge.k{background:rgba(143,211,174,.15);color:var(--accent)}
.badge.nk{background:rgba(232,139,143,.15);color:var(--red)}
.prov-m{font-size:.75rem;color:var(--ink3);font-family:"JetBrains Mono",monospace;direction:ltr;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prov-mods{font-size:.74rem;color:var(--ink2);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.mod-tag{background:var(--surface3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;
  font-family:"JetBrains Mono",monospace;font-size:.7rem;direction:ltr}

/* === login === */
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:200}
.lbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:32px;
  width:min(380px,92%);text-align:center;box-shadow:var(--sh)}
.lbox h1{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.lbox p{color:var(--ink2);font-size:.86rem;margin-bottom:18px}
.lbox input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  padding:12px 15px;font-size:.95rem;text-align:center;outline:none;margin-bottom:11px}
.lbox input:focus{border-color:var(--accent2)}
.lbox button{width:100%;padding:12px;border-radius:12px;background:var(--accent);color:#0B1512;
  border:0;font-weight:700;font-size:.95rem;cursor:pointer}
.lbox button:hover{background:#A2DFC0}
.err{color:var(--red);font-size:.82rem;margin-top:9px;min-height:18px}

@media(max-width:860px){
  #app{grid-template-columns:0 1fr}
  aside{position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:50;transform:translateX(100%);
    transition:transform .28s var(--ease)}
  [dir=rtl] aside{transform:translateX(100%)}
  aside.on{transform:none}
  .topbar{padding:10px 12px}
  select{max-width:130px;font-size:.8rem}
}

.srow{padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;transition:.15s}
.srow:hover{background:var(--hov);border-color:var(--acc)}
.sdesc{font-size:.74rem;margin-top:3px;line-height:1.5}
.dim{color:var(--ink3)}

.srow{padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;transition:.15s}
.srow:hover{background:var(--hov,#1a2430);border-color:var(--acc,#10b981)}
.sdesc{font-size:.74rem;margin-top:3px;line-height:1.5}
.skpre{font-family:ui-monospace,monospace;white-space:pre-wrap;direction:rtl;text-align:right;
  line-height:1.9;font-size:.8rem;background:var(--bg,#0b1116);padding:12px;border-radius:9px;max-height:60vh;overflow:auto}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>⚡ Nano-Hermes</h1>
    <p>Lightweight agent with server and web access</p>
    <input type="password" id="pw" placeholder="password" autocomplete="current-password">
    <button onclick="doLogin()">Sign in</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="side">
    <div class="side-head">
      <div class="brand"><span class="dot"></span><span>Nano-Hermes</span></div>
    </div>
    <div class="side-body">
      <div class="sec-t">Conversations</div>
      <div id="chatList"></div>
    </div>
    <div style="padding:10px;border-top:1px solid var(--line);display:flex;gap:7px">
      <button class="btn" style="flex:1" onclick="newChat()">+ New</button>
      <button class="btn" onclick="openSkills()">📚 Skills</button>
      <button class="btn" onclick="openProviders()">⚙ Providers</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="btn" id="menuBtn" style="display:none" onclick="document.getElementById('side').classList.toggle('on')">☰</button>
      <select id="provSel" onchange="fillModels()"></select>
      <select id="modelSel"></select>
      <div class="spacer"></div>
      <span id="status" style="font-size:.78rem;color:var(--ink3)"></span>
    </div>

    <div id="chat"></div>

    <div class="composer">
      <div class="crow">
        <textarea id="input" placeholder="Ask anything - e.g. what is the server status?" rows="1"></textarea>
        <button id="send" onclick="send()">➤</button>
      </div>
      <div class="hint">
        <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> send</span>
        <span><kbd>/clear</kbd> clear the chat view</span>
        <span id="hintProv"></span>
      </div>
    </div>
  </main>
</div>

<div class="mask" id="mask" onclick="if(event.target.id==='mask')closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let PASS = sessionStorage.getItem('nh_pass') || '';
let CID = null, PROVS = [], BUSY = false;

/* ═══ auth ═══ */
async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Pass': PASS, ...(opts.headers || {}) }
  });
  return r.json();
}
async function doLogin() {
  const pw = $('#pw').value;
  const r = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  const d = await r.json();
  if (d.ok) { PASS = pw; sessionStorage.setItem('nh_pass', pw); boot(); }
  else $('#lerr').textContent = 'wrong password';
}
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

/* ═══ boot ═══ */
async function boot() {
  $('#login').style.display = 'none';
  $('#app').style.display = 'grid';
  if (innerWidth <= 860) $('#menuBtn').style.display = '';
  await loadProviders();
  await loadChats();
  $('#input').focus();
}
if (PASS) boot();
$('#pw').focus();

async function loadProviders() {
  const d = await api('/api/providers');
  if (d.error) { PASS = ''; sessionStorage.clear(); location.reload(); return; }
  PROVS = d.providers || [];
  $('#provSel').innerHTML = PROVS.map(p =>
    `<option value="${p.name}" ${p.has_key ? '' : 'disabled'}>
      ${p.name}${p.has_key ? '' : ' (no key)'}</option>`).join('');
  fillModels();
}
function fillModels() {
  const p = PROVS.find(x => x.name === $('#provSel').value);
  const ms = p ? p.models : [];
  $('#modelSel').innerHTML = ms.map(m => `<option value="${m}">${m}</option>`).join('')
    || '<option value="">—</option>';
  $('#hintProv').textContent = p ? `${p.base_url}` : '';
}
async function loadChats() {
  const d = await api('/api/chats');
  $('#chatList').innerHTML = (d.chats || []).map(c =>
    `<div class="chat-item ${c.id === CID ? 'on' : ''}" onclick="openChat('${c.id}')">
      ${esc(c.title || 'untitled')}</div>`).join('') || '<div style="padding:8px;color:var(--ink3);font-size:.8rem">no conversations yet</div>';
}
async function openChat(id) {
  CID = id;
  const d = await api('/api/chats/' + id);
  $('#chat').innerHTML = '';
  (d.messages || []).forEach(m => addMsg(m.role === 'user' ? 'u' : 'a', m.content));
  loadChats();
  if (innerWidth <= 860) $('#side').classList.remove('on');
}
function newChat() {
  CID = null;
  $('#chat').innerHTML = '';
  loadChats();
  $('#input').focus();
  if (innerWidth <= 860) $('#side').classList.remove('on');
}

/* ═══ render ═══ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmt(txt) {
  let h = esc(txt);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, l, c) => `<pre>${c.trim()}</pre>`);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return h;
}
function addMsg(kind, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.innerHTML = fmt(text);
  $('#chat').appendChild(d);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  return d;
}
function addStep(s) {
  const a = JSON.stringify(s.args || {}).slice(0, 110);
  const d = document.createElement('div');
  d.className = 'step';
  const badge = s.ok === false ? '✗' : '✓';
  const meta = [s.ms ? s.ms + 'ms' : '', s.chars ? s.chars + 'ch' : ''].filter(Boolean).join(' · ');
  d.innerHTML = `<b>${badge} ${esc(s.tool)}</b> <span style="opacity:.6">${esc(meta)}</span><br>`
    + `<span style="opacity:.75">${esc(a)}</span><br>${esc(String(s.out || '').slice(0, 200))}`;
  d.style.opacity = s.ok === false ? '.75' : '1';
  if (s.ok === false) d.style.borderColor = 'rgba(232,139,143,.4)';
  $('#chat').appendChild(d);
  $('#chat').scrollTop = $('#chat').scrollHeight;
}

/* ═══ send ═══ */
async function send() {
  const text = $('#input').value.trim();
  if (!text || BUSY) return;
  if (text === '/clear') { $('#chat').innerHTML = ''; $('#input').value = ''; return; }

  BUSY = true; $('#send').disabled = true;
  addMsg('u', text);
  $('#input').value = ''; $('#input').style.height = 'auto';

  const prov = $('#provSel').value, model = $('#modelSel').value;
  $('#status').textContent = 'working...';
  const thinking = addMsg('a', '…');

  try {
    const d = await api('/api/chat', {
      method: 'POST',
      body: JSON.stringify({ provider: prov, model, message: text, chat_id: CID })
    });
    thinking.remove();
    if (d.steps) d.steps.forEach(st => addStep(st));
    if (d.error) addMsg('e', '❌ ' + d.error);
    else addMsg('a', d.reply);
    if (d.chat_id) CID = d.chat_id;
    loadChats();
  } catch (e) {
    thinking.remove();
    addMsg('e', 'network error: ' + e.message);
  }
  BUSY = false; $('#send').disabled = false;
  $('#status').textContent = '';
  $('#input').focus();
}
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
$('#input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 190) + 'px';
});

/* === providers modal === */
async function openSkills() {
  $('#modal').innerHTML = '<h2>📚 Learned skills</h2><div id="skBody" class="dim">…</div>';
  $('#mask').classList.add('on');
  const r = await api('/api/skills');
  if (!r || !r.skills) { $('#skBody').textContent = 'error'; return; }
  if (!r.skills.length) {
    $('#skBody').innerHTML = '<p class="dim">No skills yet. Ask the agent to save one with skill_manage after solving a problem.</p>';
    return;
  }
  let h = '<p class="dim" style="margin-bottom:10px">' + r.stats.total + ' skills - ' + r.stats.uses + ' uses</p>';
  h += r.skills.map(function (s) {
    return '<div class="srow" onclick="viewSkill(\'' + esc(s.name) + '\')"><b>' + esc(s.name) +
      '</b><span class="dim"> ' + s.uses + '×</span><div class="dim sdesc">' + esc(s.description) + '</div></div>';
  }).join('');
  $('#skBody').innerHTML = h;
}
async function viewSkill(n) {
  const r = await api('/api/skills/' + encodeURIComponent(n));
  if (!r || r.error) { alert((r && r.error) || 'error'); return; }
  const txt = (r.raw || r.content || '').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; });
  $('#modal').innerHTML = '<h2>' + esc(n) + '</h2><pre class="skpre">' + txt + '</pre>' +
    '<div style="margin-top:12px"><button class="btn" onclick="openSkills()">Back</button></div>';
}
function openProviders() {
  $('#mask').classList.add('on');
  renderProviders();
}
function closeModal() { $('#mask').classList.remove('on'); }

async function renderProviders() {
  const d = await api('/api/providers');
  const list = (d.providers || []).map(p => `
    <div class="prov">
      <div class="prov-h">
        <span class="prov-n">${esc(p.name)}</span>
        <span class="badge ${p.source === 'hermes' ? 'h' : 'm'}">${p.source === 'hermes' ? 'Hermes' : 'manual'}</span>
        <span class="badge ${p.has_key ? 'k' : 'nk'}">${p.has_key ? 'key ok' : 'no key'}</span>
        <div class="spacer" style="flex:1"></div>
        <button class="btn d" style="padding:4px 10px;font-size:.75rem" onclick="delProv(${p.id})">Delete</button>
      </div>
      <div class="prov-m">${esc(p.base_url)}</div>
      <div class="prov-mods">${p.models.slice(0, 6).map(m => `<span class="mod-tag">${esc(m)}</span>`).join('')}
        ${p.models.length > 6 ? `<span class="mod-tag">+${p.models.length - 6}</span>` : ''}</div>
    </div>`).join('');

  $('#modal').innerHTML = `
    <h2>⚙ Manage providers</h2>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn p" onclick="syncProv()">🔄 Sync from Hermes</button>
      <button class="btn" onclick="toggleAdd()">+ Add manually</button>
    </div>
    <div id="addForm" style="display:none;background:var(--surface2);border:1px solid var(--line);
         border-radius:12px;padding:14px;margin-bottom:14px">
      <div class="field"><label>Name</label><input id="pName" placeholder="OpenRouter"></div>
      <div class="field"><label>Base URL</label><input id="pUrl" placeholder="https://openrouter.ai/api/v1"></div>
      <div class="field"><label>API key (optional)</label><input id="pKey" type="password" placeholder="sk-..."></div>
      <div class="field"><label>Models (comma separated)</label><input id="pModels" placeholder="gpt-4o-mini,claude-3.5"></div>
      <button class="btn p" onclick="addProv()">Save</button>
    </div>
    <div>${list || '<p style="color:var(--ink3)">no providers</p>'}</div>
    <div style="margin-top:16px;text-align:left"><button class="btn" onclick="closeModal()">Close</button></div>`;
}
function toggleAdd() {
  const f = $('#addForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
async function syncProv() {
  await api('/api/providers/sync', { method: 'POST' });
  await loadProviders(); renderProviders();
}
async function addProv() {
  const body = {
    name: $('#pName').value.trim(), base_url: $('#pUrl').value.trim(),
    api_key: $('#pKey').value.trim(), models: $('#pModels').value.trim()
  };
  if (!body.name || !body.base_url) return alert('name and URL are required');
  await api('/api/providers', { method: 'POST', body: JSON.stringify(body) });
  await loadProviders(); renderProviders();
}
async function delProv(id) {
  if (!confirm('delete this provider?')) return;
  await api('/api/providers/' + id, { method: 'DELETE' });
  await loadProviders(); renderProviders();
}
</script>

      <span id="skillStat" class="dim"></span>
      <button class="x" onclick="closeSkills()">✕</button>
    </div>
    <div id="skillList" class="mlist"></div>
  </div>
</div>
</body>
